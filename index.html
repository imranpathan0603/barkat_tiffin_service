<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:var(--txt);font-size:14px}

input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--txt)}

.stat.green .val{color:var(--ok)}.stat.blue .val{color:var(--accent)}.stat.amber .val{color:var(--warn)}.stat.red .val{color:var(--danger)}

.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">BT</div>
      <div><b>Barkat Tiffin</b><div class="muted small" style="color:#94a3b8">Billing System</div></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <header id="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div id="topActions"></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================
   BARKAT TIFFIN SERVICE — BILLING SUBSYSTEM
   ========================================================= */

/* ============== Utility ============== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pad = (n,l=2) => String(n).padStart(l,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const num = n => Number(n||0);
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthShort = m => monthNames[m-1].slice(0,3);
const isoDisplay = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d} ${monthShort(+m)} ${y}`; };
const monthRange = (year,month) => {
  const last = new Date(year, month, 0).getDate();
  return { start:`${year}-${pad(month)}-01`, end:`${year}-${pad(month)}-${pad(last)}`, days:last };
};
const inRange = (iso, s, e) => iso >= s && iso <= e;
function toast(msg, type='') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toastRoot').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 2600);
}

/* ============== IndexedDB ============== */
const DB_NAME='barkat_tiffin_db', DB_VERSION=1;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      const ensure = (name, keyPath, autoInc=true, indexes=[]) => {
        if (!d.objectStoreNames.contains(name)) {
          const s = d.createObjectStore(name, {keyPath, autoIncrement:autoInc});
          indexes.forEach(([iname, ipath, uniq]) => s.createIndex(iname, ipath, {unique:!!uniq}));
        }
      };
      ensure('companies','id',true,[['companyCode','companyCode',false],['companyName','companyName',false]]);
      ensure('customers','id',true,[['companyId','companyId',false],['name','name',false]]);
      ensure('foodItems','id',true,[['name','name',false]]);
      ensure('dailyEntries','id',true,[['customerId','customerId',false],['date','date',false],['companyId','companyId',false],['customer_date',['customerId','date'],true]]);
      ensure('bills','id',true,[['billNumber','billNumber',true],['billType','billType',false],['customerId','customerId',false],['companyId','companyId',false],['billingPeriodStart','billingPeriodStart',false]]);
      ensure('bill_items','id',true,[['billId','billId',false]]);
      ensure('bill_customer_summary','id',true,[['billId','billId',false]]);
      ensure('bill_payments','id',true,[['billId','billId',false],['companyId','companyId',false],['customerId','customerId',false]]);
      ensure('settings','key',false,[]);
    };
    req.onsuccess = e => { db=e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function _tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function dbPut(store, obj){ return new Promise((res,rej)=>{ const r=_tx(store,'readwrite').put(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGet(store, key){ return new Promise((res,rej)=>{ const r=_tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=_tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbDel(store, key){ return new Promise((res,rej)=>{ const r=_tx(store,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function dbByIndex(store, index, key){ return new Promise((res,rej)=>{ const r=_tx(store).index(index).getAll(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbOneByIndex(store, index, key){ return new Promise((res,rej)=>{ const r=_tx(store).index(index).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

/* ============== State ============== */
const state = {
  route:'dashboard',
  companies:[],
  customers:[],
  foods:[],
  settings:{},
};

async function refreshCache(){
  state.companies = await dbGetAll('companies');
  state.customers = await dbGetAll('customers');
  state.foods     = await dbGetAll('foodItems');
}

/* ============== Seed data (first run) ============== */
async function seedIfEmpty(){
  const foods = await dbGetAll('foodItems');
  if (foods.length === 0) {
    await dbPut('foodItems',{name:'Lunch', rate:80, active:true, createdAt:Date.now()});
    await dbPut('foodItems',{name:'Dinner', rate:80, active:true, createdAt:Date.now()});
    await dbPut('foodItems',{name:'Tea', rate:15, active:true, createdAt:Date.now()});
    await dbPut('foodItems',{name:'Chapati', rate:10, active:true, createdAt:Date.now()});
  }
  const s = await dbGet('settings','business');
  if (!s) await dbPut('settings',{key:'business', name:'Barkat Tiffin Service', address:'', mobile:'', email:'', gstin:'', notes:'Thank you for using Barkat Tiffin Service.'});
}

/* =========================================================
   BILL NUMBERING  (unique, sequential)
   ========================================================= */
async function nextBillNumber(billType, dateISO){
  // DAILY  -> BT-YYYYMMDD-NNN
  // CUSTOMER_MONTHLY / COMPANY_MONTHLY -> BT-M-YYYYMM-NNN
  let prefix;
  if (billType === 'DAILY') {
    const d = dateISO.replace(/-/g,'');
    prefix = `BT-${d}-`;
  } else {
    const ym = dateISO.slice(0,7).replace('-','');
    prefix = `BT-M-${ym}-`;
  }
  const all = await dbGetAll('bills');
  const used = all.filter(b => b.billNumber && b.billNumber.startsWith(prefix))
                  .map(b => parseInt(b.billNumber.slice(prefix.length),10))
                  .filter(n => !isNaN(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return prefix + pad(next,3);
}

/* =========================================================
   BILLING ENGINE
   ========================================================= */

/* Compute daily total for a customer on a date (returns { items, total }) */
async function computeDailyTotal(customerId, dateISO){
  const e = await dbOneByIndex('dailyEntries','customer_date',[customerId, dateISO]);
  if (!e) return { items:[], total:0 };
  return { items:e.items||[], total: num(e.total) };
}

/* Compute monthly total for one customer */
async function computeCustomerMonthly(customerId, year, month){
  const {start,end,days} = monthRange(year,month);
  const entries = await dbByIndex('dailyEntries','customerId',customerId);
  const inMonth = entries.filter(e => e.date>=start && e.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  let total = 0;
  const dayRows = inMonth.map(e => {
    total += num(e.total);
    return { date:e.date, items:e.items||[], total:num(e.total) };
  });
  return { start, end, days, dayRows, total };
}

/* Previous balance for a customer = sum of outstanding on all their prior non-cancelled bills */
async function computeCustomerPreviousBalance(customerId, beforeDateISO){
  const bills = (await dbByIndex('bills','customerId',customerId))
    .filter(b => b.status !== 'Cancelled' && b.billingPeriodEnd < beforeDateISO);
  let bal = 0;
  for (const b of bills) bal += num(b.outstanding);
  return bal;
}

/* Company monthly aggregate */
async function computeCompanyMonthly(companyId, year, month){
  const {start,end,days} = monthRange(year,month);
  const customers = (await dbByIndex('customers','companyId',companyId))
    .filter(c => c.status !== 'Inactive');
  const rows = [];
  for (const c of customers) {
    const m = await computeCustomerMonthly(c.id, year, month);
    const dayTotals = new Array(days).fill(0);
    m.dayRows.forEach(r => {
      const d = parseInt(r.date.slice(-2),10);
      dayTotals[d-1] = r.total;
    });
    rows.push({
      customerId:c.id,
      customerName:c.name,
      mobile:c.mobile||'',
      dayRows:m.dayRows,
      dayTotals,
      total:m.total
    });
  }
  const subtotal = rows.reduce((s,r)=>s+r.total,0);
  return { start, end, days, rows, subtotal };
}

/* Determine status from totals */
function computeStatus(billTotal, paidAmount){
  if (billTotal <= 0) return 'Paid';
  if (paidAmount <= 0) return 'Unpaid';
  if (paidAmount < billTotal) return 'Partially Paid';
  return 'Paid';
}

/* Sum payments against a bill */
async function sumBillPayments(billId){
  const ps = await dbByIndex('bill_payments','billId',billId);
  return ps.reduce((s,p)=>s+num(p.amount),0);
}

/* Recompute bill paid/outstanding/status */
async function refreshBillTotals(billId){
  const bill = await dbGet('bills',billId);
  if (!bill) return null;
  const paid = await sumBillPayments(billId);
  bill.paidAmount = paid;
  bill.outstanding = Math.max(0, num(bill.subtotal) - paid);
  bill.status = bill.status === 'Cancelled' ? 'Cancelled' : computeStatus(num(bill.subtotal), paid);
  bill.updatedAt = Date.now();
  await dbPut('bills',bill);
  return bill;
}

/* =========================================================
   DAILY BILLS
   ========================================================= */
async function generateDailyBillForEntry(entry, force=false){
  // Skip if bill already exists for this entry (customer+date)
  const existing = (await dbByIndex('bills','billType','DAILY'))
                    .find(b => b.customerId===entry.customerId && b.billingPeriodStart===entry.date && b.status!=='Cancelled');
  if (existing && !force) return existing;

  const customer = await dbGet('customers', entry.customerId);
  const company  = entry.companyId ? await dbGet('companies', entry.companyId) : null;
  const billNumber = await nextBillNumber('DAILY', entry.date);
  const now = Date.now();

  const bill = {
    billNumber,
    billType:'DAILY',
    customerId: entry.customerId,
    companyId: entry.companyId || null,
    // SNAPSHOT — never changes:
    snapshot: {
      customerName: customer?.name || '',
      customerMobile: customer?.mobile || '',
      companyName: company?.companyName || '',
      companyAddress: company?.address || '',
      companyMobile: company?.mobile || '',
      business: state.settings.business || await dbGet('settings','business'),
    },
    billingPeriodStart: entry.date,
    billingPeriodEnd: entry.date,
    items: (entry.items||[]).map(i=>({...i})),
    subtotal: num(entry.total),
    previousBalance: 0,
    payments: 0,
    outstanding: num(entry.total),
    paidAmount: 0,
    status:'Unpaid',
    createdAt: now, updatedAt: now
  };
  const id = await dbPut('bills', bill);
  bill.id = id;
  // persist bill_items
  for (const it of bill.items) {
    await dbPut('bill_items',{ billId:id, description:it.name, qty:it.qty, rate:it.rate, amount:num(it.amount) });
  }
  return bill;
}

async function generateDailyBillsForDate(dateISO, force=false){
  const entries = (await dbByIndex('dailyEntries','date',dateISO));
  const created = [];
  for (const e of entries) {
    const b = await generateDailyBillForEntry(e, force);
    if (b) created.push(b);
  }
  return created;
}

/* =========================================================
   CUSTOMER MONTHLY BILLS
   ========================================================= */
async function generateCustomerMonthlyBill(customerId, year, month, force=false){
  const existing = (await dbByIndex('bills','billType','CUSTOMER_MONTHLY'))
                    .find(b => b.customerId===customerId
                            && b.billingPeriodStart===monthRange(year,month).start
                            && b.status !== 'Cancelled');
  if (existing && !force) return existing;

  const cust = await dbGet('customers', customerId);
  const company = cust?.companyId ? await dbGet('companies', cust.companyId) : null;
  const m = await computeCustomerMonthly(customerId, year, month);
  const prev = await computeCustomerPreviousBalance(customerId, m.start);
  const billNumber = await nextBillNumber('CUSTOMER_MONTHLY', m.start);
  const now = Date.now();

  const bill = {
    billNumber,
    billType:'CUSTOMER_MONTHLY',
    customerId,
    companyId: cust?.companyId || null,
    snapshot: {
      customerName: cust?.name || '',
      customerMobile: cust?.mobile || '',
      companyName: company?.companyName || '',
      companyAddress: company?.address || '',
      companyMobile: company?.mobile || '',
      business: state.settings.business,
    },
    billingPeriodStart: m.start,
    billingPeriodEnd: m.end,
    billingMonth: `${monthNames[month-1]} ${year}`,
    items: m.dayRows.map(r => ({
      date: r.date,
      description: (r.items||[]).map(i=>`${i.name} x${i.qty}`).join(' + ') || '—',
      amount: num(r.total)
    })),
    subtotal: m.total,
    previousBalance: prev,
    payments: 0,
    outstanding: m.total + prev,
    paidAmount: 0,
    status:'Unpaid',
    createdAt: now, updatedAt: now
  };
  const id = await dbPut('bills', bill);
  bill.id = id;
  for (const it of bill.items) {
    await dbPut('bill_items',{ billId:id, date:it.date, description:it.description, amount:it.amount });
  }
  return bill;
}

/* =========================================================
   COMPANY MASTER BILLS
   ========================================================= */
async function generateCompanyMasterBill(companyId, year, month, format='summary', force=false){
  const range = monthRange(year,month);
  const existing = (await dbByIndex('bills','billType','COMPANY_MONTHLY'))
                    .find(b => b.companyId===companyId && b.billingPeriodStart===range.start && b.status!=='Cancelled');
  if (existing && !force) return existing;

  const company = await dbGet('companies', companyId);
  const agg = await computeCompanyMonthly(companyId, year, month);

  // previous balance = sum of outstanding of prior company bills
  const prevBills = (await dbByIndex('bills','companyId',companyId))
    .filter(b => b.billType==='COMPANY_MONTHLY' && b.status!=='Cancelled' && b.billingPeriodEnd < range.start);
  const prev = prevBills.reduce((s,b)=>s+num(b.outstanding),0);

  const billNumber = await nextBillNumber('COMPANY_MONTHLY', range.start);
  const now = Date.now();
  const bill = {
    billNumber,
    billType:'COMPANY_MONTHLY',
    companyId,
    customerId:null,
    snapshot:{
      companyName: company?.companyName || '',
      companyCode: company?.companyCode || '',
      contactPerson: company?.contactPerson || '',
      companyMobile: company?.mobile || '',
      companyEmail: company?.email || '',
      companyAddress: company?.address || '',
      business: state.settings.business,
    },
    billingPeriodStart: range.start,
    billingPeriodEnd: range.end,
    billingMonth: `${monthNames[month-1]} ${year}`,
    format,
    days: agg.days,
    rows: agg.rows, // { customerId, customerName, mobile, dayTotals[], total }
    subtotal: agg.subtotal,
    previousBalance: prev,
    payments: 0,
    outstanding: agg.subtotal + prev,
    paidAmount: 0,
    status:'Unpaid',
    createdAt: now, updatedAt: now
  };
  const id = await dbPut('bills', bill);
  bill.id = id;
  // save per-customer summary rows
  for (const r of agg.rows) {
    await dbPut('bill_customer_summary',{ billId:id, customerId:r.customerId, customerName:r.customerName, total:r.total });
  }
  return bill;
}

/* =========================================================
   PAYMENTS
   ========================================================= */
async function recordPayment({ billId, companyId, customerId, amount, mode, reference, notes, allocations }){
  const bill = billId ? await dbGet('bills',billId) : null;
  const now = Date.now();
  const payment = {
    billId: billId || null,
    companyId: companyId || bill?.companyId || null,
    customerId: customerId || bill?.customerId || null,
    amount: num(amount),
    paymentDate: todayISO(),
    paymentMode: mode || 'Cash',
    reference: reference || '',
    notes: notes || '',
    allocations: allocations || null, // [{ customerId, amount }]
    createdAt: now
  };
  const id = await dbPut('bill_payments', payment);
  payment.id = id;
  if (billId) await refreshBillTotals(billId);
  return payment;
}

function renderRecentBills(list){
  if (!list.length) return `<div class="empty">No bills yet.</div>`;
  return `<table class="tbl"><thead><tr><th>Bill#</th><th>Type</th><th>Period</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>
    ${list.map(b=>`<tr>
      <td>${esc(b.billNumber)}</td>
      <td>${esc(b.billType)}</td>
      <td>${esc(b.billingPeriodStart)}</td>
      <td class="num">${money(b.subtotal)}</td>
      <td><span class="badge ${statusClass(b.status)}">${esc(b.status)}</span></td>
    </tr>`).join('')}

function statusClass(s){
  if (s==='Paid') return 'paid';
  if (s==='Partially Paid') return 'partial';
  if (s==='Unpaid') return 'unpaid';
  if (s==='Cancelled') return 'cancelled';
  return 'draft';
}

/* =========================================================
   VIEW: QUICK DAILY ENTRY
   ========================================================= */
async function viewDailyEntry(){
  await refreshCache();
  setTop('Quick Daily Entry');

  const today = todayISO();
  const stateDE = { date: today, companyId:'' };

  function render(){
    const foods = state.foods.filter(f=>f.active!==false);
    const custList = state.customers
      .filter(c => c.status!=='Inactive' && (!stateDE.companyId || c.companyId===Number(stateDE.companyId)));
    const html = `
      <div class="toolbar">
        <div style="max-width:180px"><label>Date</label>
          <input type="date" id="de-date" value="${stateDE.date}">
        </div>
        <div><label>Company filter</label>
          <select id="de-company">
            <option value="">All Customers</option>
            ${state.companies.map(c=>`<option value="${c.id}" ${stateDE.companyId==c.id?'selected':''}>${esc(c.companyName)}</option>`).join('')}
          </select>
        </div>
        <button class="primary" onclick="window.__deSaveAll()">💾 Save All Entries</button>
        <button class="accent" onclick="window.__deSaveAndBill()">💾 Save & Generate Daily Bills</button>
      </div>
      <div class="card">
        <table class="tbl"><thead><tr>
          <th class="name">Customer</th>
          ${foods.map(f=>`<th class="num">${esc(f.name)}<br><span class="muted small">₹${f.rate}</span></th>`).join('')}
          <th class="num">Total</th>
        </tr></thead>
        <tbody id="de-body"></tbody></table>
      </div>
    `;
    $('#content').innerHTML = html;

    $('#de-date').onchange = e => { stateDE.date = e.target.value; render(); };
    $('#de-company').onchange = e => { stateDE.companyId = e.target.value; render(); };

    const tbody = $('#de-body');
    if (!custList.length){
      tbody.innerHTML = `<tr><td colspan="${foods.length+2}"><div class="empty">No customers.</div></td></tr>`;
      return;
    }
    (async () => {
      for (const c of custList){
        const e = await dbOneByIndex('dailyEntries','customer_date',[c.id, stateDE.date]);
        const byFood = {};
        (e?.items||[]).forEach(it=>{ byFood[it.foodItemId] = it.qty; });
        const tr = document.createElement('tr');
        tr.dataset.cust = c.id;
        tr.innerHTML = `<td class="name">${esc(c.name)}${c.companyId?' <span class="muted small">('+esc(state.companies.find(x=>x.id===c.companyId)?.companyName||'')+')</span>':''}</td>
          ${foods.map(f=>`<td class="num"><input type="number" min="0" step="1" class="qty-input" data-food="${f.id}" value="${byFood[f.id]||''}" placeholder="0"></td>`).join('')}
          <td class="num row-total">₹0</td>`;
        tbody.appendChild(tr);
        tr.querySelectorAll('.qty-input').forEach(inp => inp.oninput = () => recalcRow(tr));
        recalcRow(tr);
      }
    })();

    function recalcRow(tr){
      let total = 0;
      tr.querySelectorAll('.qty-input').forEach(inp => {
        const f = foods.find(x=>x.id===Number(inp.dataset.food));
        const q = num(inp.value);
        if (f && q>0) total += q*num(f.rate);
      });
      tr.querySelector('.row-total').textContent = money(total);
    }
  }

  // save all
  window.__deSaveAll = async () => {
    const rows = $$('#de-body tr[data-cust]');
    let saved = 0;
    for (const tr of rows){
      const custId = Number(tr.dataset.cust);
      const cust = state.customers.find(c=>c.id===custId);
      const items = [];
      tr.querySelectorAll('.qty-input').forEach(inp => {
        const q = num(inp.value);
        if (q>0){
          const f = state.foods.find(x=>x.id===Number(inp.dataset.food));
          if (f) items.push({ foodItemId:f.id, name:f.name, qty:q, rate:num(f.rate), amount:q*num(f.rate) });
        }
      });
      const total = items.reduce((s,i)=>s+i.amount,0);
      // find existing
      const existing = await dbOneByIndex('dailyEntries','customer_date',[custId, stateDE.date]);
      if (!items.length && existing) { await dbDel('dailyEntries', existing.id); continue; }
      if (!items.length) continue;
      const obj = {
        id: existing?.id,
        customerId: custId,
        companyId: cust?.companyId || null,
        date: stateDE.date,
        items, total,
        updatedAt: Date.now(),
        createdAt: existing?.createdAt || Date.now()
      };
      await dbPut('dailyEntries', obj);
      saved++;
    }
    toast(`Saved ${saved} entries`,'ok');
  };

  window.__deSaveAndBill = async () => {
    await window.__deSaveAll();
    const bills = await generateDailyBillsForDate(stateDE.date, true);
    toast(`Generated ${bills.length} daily bills`,'ok');
    go('dailyBills');
  };

  render();
}

function renderCustomerBillHTML(b){
  const bus = b.snapshot.business || {};
  const head = [
    center(bus.name || 'BARKAT TIFFIN SERVICE'),
    center(bus.address || ''),
    center(bus.mobile ? 'Mobile: '+bus.mobile : ''),
    '',
    center(b.billType==='DAILY' ? 'DAILY FOOD BILL' : 'MONTHLY BILL'),
    center('Bill No: ' + b.billNumber),
    b.billType==='DAILY' ? center('Date: ' + isoDisplay(b.billingPeriodStart))
                         : center('Billing Period: ' + isoDisplay(b.billingPeriodStart) + ' - ' + isoDisplay(b.billingPeriodEnd)),
    '',
  ].join('\n');

  let cust = [
    'Customer: ' + b.snapshot.customerName,
    b.snapshot.customerMobile ? 'Mobile: ' + b.snapshot.customerMobile : '',
    b.snapshot.companyName ? 'Company: ' + b.snapshot.companyName : '',
    '',
    '------------------------------------------------------------',
  ].filter(x => x !== '').join('\n');

  let table = '';
  if (b.billType === 'DAILY'){
    table += 'Food          Qty    Rate       Amount\n';
    table += '------------------------------------------------------------\n';
    b.items.forEach(i=>{
      table += padEnd(i.name,14)+padEnd(String(i.qty),7)+padEnd(money(i.rate),11)+money(i.amount)+'\n';
    });
    table += '------------------------------------------------------------\n';
    table += padEnd('TOTAL',32)+money(b.subtotal)+'\n';
  } else {
    table += 'Date       Food Details                Amount\n';
    table += '------------------------------------------------------------\n';
    b.items.forEach(i=>{
      table += padEnd(isoDisplay(i.date),11)+padEnd((i.description||'').slice(0,26),27)+money(i.amount)+'\n';
    });
    table += '------------------------------------------------------------\n';
    table += padEnd('Monthly Total',38)+money(b.subtotal)+'\n';
  }

  let summary = '';
  if (b.billType === 'CUSTOMER_MONTHLY'){
    summary += '\nPrevious Balance     ' + money(b.previousBalance) + '\n';
    summary += 'Current Month        ' + money(b.subtotal) + '\n';
    summary += 'Payment Received     ' + money(b.paidAmount) + '\n';
    summary += '---------------------------------\n';
    summary += 'Outstanding          ' + money(b.outstanding + b.previousBalance) + '\n';
  } else {
    summary += '\nPaid                 ' + money(b.paidAmount) + '\n';
    summary += 'Outstanding          ' + money(b.outstanding) + '\n';
  }

  return esc(head) + '\n' + esc(cust) + '\n' + esc(table) + esc(summary) + '\n\n' + esc(bus.notes || 'Thank you.');
}

function renderCompanyBillHTML(b){
  const bus = b.snapshot.business || {};
  const lines = [];
  lines.push(center(bus.name || 'BARKAT TIFFIN SERVICE'));
  lines.push(center('MONTHLY INVOICE'));
  lines.push('');
  lines.push('Bill No: ' + b.billNumber);
  lines.push('Billing Period: ' + isoDisplay(b.billingPeriodStart) + ' - ' + isoDisplay(b.billingPeriodEnd));
  lines.push('');
  lines.push('BILL TO:');
  lines.push(b.snapshot.companyName);
  if (b.snapshot.contactPerson) lines.push('Contact Person: ' + b.snapshot.contactPerson);
  if (b.snapshot.companyMobile) lines.push('Mobile: ' + b.snapshot.companyMobile);
  if (b.snapshot.companyAddress) lines.push(b.snapshot.companyAddress);
  lines.push('');
  lines.push('-'.repeat(70));

  if (b.format === 'day-wise'){
    // matrix
    const daysHeader = Array.from({length:b.days},(_,i)=>pad(i+1,2)).join(' ');
    lines.push('Sr | Customer          | ' + daysHeader + ' | Total');
    lines.push('-'.repeat(70));
    b.rows.forEach((r,i)=>{
      const cells = r.dayTotals.map(v => v>0 ? pad(v,2) : ' 0').join(' ');
      lines.push(`${pad(i+1,2)} | ${padEnd(r.customerName.slice(0,17),17)} | ${cells} | ${money(r.total)}`);
    });
  } else if (b.format === 'detailed'){
    // per customer, per day lines
    b.rows.forEach((r,i)=>{
      lines.push('');
      lines.push(`${i+1}. ${r.customerName}  (${r.mobile||''})`);
      r.dayRows.forEach(d=>{
        const txt = (d.items||[]).map(x=>x.name+' x'+x.qty).join(' + ') || '—';
        lines.push('   ' + padEnd(isoDisplay(d.date),11) + padEnd(txt.slice(0,34),36) + money(d.total));
      });
      lines.push('   ' + padEnd('Sub Total',47) + money(r.total));
    });
  } else {
    // summary
    lines.push('Customer                          Total');
    lines.push('-'.repeat(70));
    b.rows.forEach(r => {
      lines.push(padEnd(r.customerName.slice(0,32),33) + money(r.total));
    });
  }

  lines.push('-'.repeat(70));
  lines.push(padEnd('GRAND TOTAL',55) + money(b.subtotal));
  lines.push('');
  lines.push('Previous Balance                 ' + money(b.previousBalance));
  lines.push('Current Month Charges            ' + money(b.subtotal));
  lines.push('Payments Received                ' + money(b.paidAmount));
  lines.push('-'.repeat(34));
  lines.push('TOTAL OUTSTANDING                ' + money(b.outstanding + b.previousBalance));
  lines.push('');
  lines.push('Terms & Notes:');
  lines.push(bus.notes || 'Thank you for using Barkat Tiffin Service.');
  return esc(lines.join('\n'));
}
function center(s, w=70){ if(!s) return ''; const p = Math.max(0, Math.floor((w - s.length)/2)); return ' '.repeat(p)+s; }
function padEnd(s,n){ s = String(s??''); return s.length>=n ? s.slice(0,n) : s + ' '.repeat(n-s.length); }

async function recordPaymentModal(billId){
  const b = billId ? await dbGet('bills',billId) : null;
  const suggest = b ? num(b.outstanding) : 0;
  modal({
    title: b ? `Record Payment — ${b.billNumber}` : 'Record Payment',
    body: `
      ${b ? `
        <div class="stat" style="margin-bottom:14px">
          <div class="lbl">Bill Total</div><div class="val">${money(b.subtotal)}</div>
          <div class="sub">Paid: ${money(b.paidAmount)} · Outstanding: ${money(b.outstanding)}</div>
        </div>
      ` : ''}
      <div class="form-row">
        <div><label>Amount (₹) *</label><input id="pay-amt" type="number" step="0.01" value="${suggest}"></div>
        <div><label>Mode</label>
          <select id="pay-mode">
            ${['Cash','UPI','Bank Transfer','Cheque','Other'].map(m=>`<option>${m}</option>`).join('')}
          </select></div>
      </div>
      <div class="form-row">
        <div><label>Reference</label><input id="pay-ref" placeholder="UPI / Cheque No."></div>
        <div><label>Notes</label><input id="pay-notes"></div>
      </div>
      ${b && b.billType==='COMPANY_MONTHLY' ? `
        <h3>Optional Allocation</h3>
        <div class="muted small" style="margin-bottom:6px">Leave blank to keep as unallocated company credit.</div>
        <table class="tbl"><thead><tr><th>Customer</th><th class="num">Amount</th></tr></thead><tbody>
          ${b.rows.map(r=>`<tr><td>${esc(r.customerName)}</td><td class="num"><input type="number" class="alloc-input" data-cust="${r.customerId}" placeholder="0" step="0.01"></td></tr>`).join('')}
        </tbody></table>
      ` : ''}
    `,
    save: async () => {
      const amt = num($('#pay-amt').value);
      if (amt <= 0) return toast('Amount required','err');
      const allocations = [];
      $$('.alloc-input').forEach(inp=>{
        const v = num(inp.value);
        if (v > 0) allocations.push({ customerId:Number(inp.dataset.cust), amount:v });
      });
      await recordPayment({
        billId: billId || null,
        companyId: b?.companyId || null,
        customerId: b?.customerId || null,
        amount: amt,
        mode: $('#pay-mode').value,
        reference: $('#pay-ref').value.trim(),
        notes: $('#pay-notes').value.trim(),
        allocations: allocations.length ? allocations : null
      });
      toast('Payment recorded','ok');
      closeModal();
      // Re-render current view
      go(state.route);
      if (billId) showBill(billId);
    }
  });
}

async function viewBackup(){
  setTop('Backup / Restore');
  $('#content').innerHTML = `
    <div class="card">
      <h3>Backup (Download JSON)</h3>
      <p class="muted small">Exports all data (companies, customers, foods, entries, bills, payments) into a single JSON file.</p>
      <button class="primary" onclick="downloadBackup()">⬇ Download Backup</button>
    </div>
    <div class="card">
      <h3>Restore</h3>
      <p class="muted small">Restores from a previously downloaded backup. Existing data will be replaced.</p>
      <input type="file" id="restore-file" accept="application/json">
      <button class="accent" style="margin-top:10px" onclick="restoreBackup()">⬆ Restore from File</button>
    </div>
    <div class="card">
      <h3>Danger Zone</h3>
      <p class="muted small">Delete all data permanently.</p>
      <button class="danger" onclick="wipeAll()">Delete All Data</button>
    </div>
  `;
}
async function downloadBackup(){
  const stores = ['companies','customers','foodItems','dailyEntries','bills','bill_items','bill_customer_summary','bill_payments','settings'];
  const data = {};
  for (const s of stores) data[s] = await dbGetAll(s);
  const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `barkat-backup-${todayISO()}.json`;
  a.click();
  toast('Backup downloaded','ok');
}
async function restoreBackup(){
  const file = $('#restore-file').files[0];
  if (!file) return toast('Pick a file','err');
  const text = await file.text();
  const obj = JSON.parse(text);
  if (!obj.data) return toast('Invalid backup','err');
  if (!confirm('This will REPLACE all existing data. Continue?')) return;
  const stores = ['companies','customers','foodItems','dailyEntries','bills','bill_items','bill_customer_summary','bill_payments','settings'];
  for (const s of stores){
    await new Promise((res,rej)=>{
      const t = db.transaction(s,'readwrite');
      const st = t.objectStore(s);
      st.clear();
      const rows = obj.data[s] || [];
      rows.forEach(r => st.put(r));
      t.oncomplete = res; t.onerror = ()=>rej(t.error);
    });
  }
  await refreshCache();
  toast('Restore complete','ok');
  go('dashboard');
}
async function wipeAll(){
  if (!confirm('Permanently delete ALL data?')) return;
  const stores = ['companies','customers','foodItems','dailyEntries','bills','bill_items','bill_customer_summary','bill_payments','settings'];
  for (const s of stores) await new Promise(res=>{ const t=db.transaction(s,'readwrite'); t.objectStore(s).clear(); t.oncomplete=res; });
  await refreshCache();
  toast('All data deleted','ok');
  go('dashboard');
}

async function exportBillPDF(id){
  const b = await dbGet('bills', id);
  if (!b) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: (b.billType==='COMPANY_MONTHLY' ? 'landscape' : 'portrait'), unit:'pt', format:'a4'});
  const bus = b.snapshot.business || {};
  const W = doc.internal.pageSize.getWidth();
  let y = 45;

  doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text(bus.name || 'BARKAT TIFFIN SERVICE', W/2, y, {align:'center'}); y += 18;
  doc.setFontSize(10); doc.setFont(undefined,'normal');
  if (bus.address) { doc.text(bus.address, W/2, y, {align:'center'}); y += 12; }
  if (bus.mobile)  { doc.text('Mobile: '+bus.mobile, W/2, y, {align:'center'}); y += 12; }
  y += 6;
  doc.setFontSize(12); doc.setFont(undefined,'bold');
  doc.text(b.billType==='DAILY' ? 'DAILY FOOD BILL' : (b.billType==='CUSTOMER_MONTHLY' ? 'MONTHLY BILL' : 'MONTHLY INVOICE'), W/2, y, {align:'center'}); y += 18;
  doc.setFontSize(10); doc.setFont(undefined,'normal');
  doc.text('Bill No: '+b.billNumber, 40, y); y += 12;
  doc.text('Billing Period: '+isoDisplay(b.billingPeriodStart)+' - '+isoDisplay(b.billingPeriodEnd), 40, y); y += 16;

  if (b.billType === 'COMPANY_MONTHLY'){
    doc.setFont(undefined,'bold'); doc.text('BILL TO:', 40, y); y += 12; doc.setFont(undefined,'normal');
    doc.text(b.snapshot.companyName||'', 40, y); y += 12;
    if (b.snapshot.contactPerson) { doc.text('Contact Person: '+b.snapshot.contactPerson, 40, y); y += 12; }
    if (b.snapshot.companyMobile) { doc.text('Mobile: '+b.snapshot.companyMobile, 40, y); y += 12; }
    y += 6;

    if (b.format === 'day-wise'){
      const head = [['Sr','Customer', ...Array.from({length:b.days},(_,i)=>pad(i+1,2)), 'Total']];
      const body = b.rows.map((r,i)=>[
        i+1, r.customerName,
        ...r.dayTotals.map(v => v>0 ? v : ''),
        r.total.toFixed(2)
      ]);
      doc.autoTable({startY:y, head, body, styles:{fontSize:7,cellPadding:3}, headStyles:{fillColor:[16,185,129]}, columnStyles:{0:{cellWidth:24},1:{cellWidth:100}}});
      y = doc.lastAutoTable.finalY + 20;
    } else if (b.format === 'detailed'){
      const head = [['Customer','Date','Items','Amount']];
      const body = [];
      b.rows.forEach(r=>{
        r.dayRows.forEach(d=>{
          body.push([r.customerName, isoDisplay(d.date), (d.items||[]).map(x=>x.name+' x'+x.qty).join(' + '), money(d.total)]);
        });
        body.push([{content:'Sub Total: '+r.customerName, colSpan:3, styles:{halign:'right',fontStyle:'bold'}}, {content:money(r.total), styles:{fontStyle:'bold',halign:'right'}}]);
      });
      doc.autoTable({startY:y, head, body, styles:{fontSize:9,cellPadding:4}, headStyles:{fillColor:[16,185,129]}});
      y = doc.lastAutoTable.finalY + 20;
    } else {
      const head = [['#','Customer','Mobile','Total']];
      const body = b.rows.map((r,i)=>[i+1, r.customerName, r.mobile||'', money(r.total)]);
      doc.autoTable({startY:y, head, body, styles:{fontSize:10,cellPadding:5}, headStyles:{fillColor:[16,185,129]}});
      y = doc.lastAutoTable.finalY + 12;
      doc.setFont(undefined,'bold'); doc.setFontSize(11);
      doc.text('GRAND TOTAL', W-150, y); doc.text(money(b.subtotal), W-40, y, {align:'right'}); y += 20;
    }

    // Summary block
    doc.setFontSize(10); doc.setFont(undefined,'normal');
    const summary = [
      ['Customer Count', b.rows.length],
      ['Monthly Charges', money(b.subtotal)],
      ['Previous Balance', money(b.previousBalance)],
      ['Payments Received', money(b.paidAmount)],
      ['TOTAL OUTSTANDING', money(b.outstanding + b.previousBalance)],
    ];
    summary.forEach(([k,v])=>{
      doc.text(k, W-280, y); doc.text(String(v), W-40, y, {align:'right'}); y += 14;
    });

    y += 24;
    doc.text('Terms & Notes: '+(bus.notes||'Thank you for using Barkat Tiffin Service.'), 40, y); y += 40;
    doc.line(40, y, 240, y); doc.text('Authorized Signature', 40, y+12);
    doc.line(W-240, y, W-40, y); doc.text('Customer / Company Acknowledgement', W-240, y+12);
  } else {
    // Daily / Customer monthly
    doc.setFont(undefined,'bold'); doc.text('Customer: '+b.snapshot.customerName, 40, y); y += 12; doc.setFont(undefined,'normal');
    if (b.snapshot.customerMobile) { doc.text('Mobile: '+b.snapshot.customerMobile, 40, y); y += 12; }
    if (b.snapshot.companyName) { doc.text('Company: '+b.snapshot.companyName, 40, y); y += 12; }
    y += 6;
    if (b.billType === 'DAILY'){
      doc.autoTable({
        startY:y, head:[['Food','Qty','Rate','Amount']],
        body: b.items.map(i=>[i.name, i.qty, money(i.rate), money(i.amount)]),
        styles:{fontSize:10,cellPadding:5}, headStyles:{fillColor:[16,185,129]},
        columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}},
        foot:[['','','TOTAL', money(b.subtotal)]]
      });
    } else {
      doc.autoTable({
        startY:y, head:[['Date','Food Details','Amount']],
        body: b.items.map(i=>[isoDisplay(i.date), i.description||'', money(i.amount)]),
        styles:{fontSize:10,cellPadding:5}, headStyles:{fillColor:[16,185,129]},
        columnStyles:{2:{halign:'right'}},
        foot:[['','Monthly Total', money(b.subtotal)]]
      });
    }
    y = doc.lastAutoTable.finalY + 16;
    doc.text('Previous Balance: '+money(b.previousBalance), 40, y); y+=12;
    doc.text('Current Month: '+money(b.subtotal), 40, y); y+=12;
    doc.text('Payment Received: '+money(b.paidAmount), 40, y); y+=12;
    doc.setFont(undefined,'bold');
    doc.text('Outstanding: '+money(b.outstanding + b.previousBalance), 40, y);
  }

  doc.save(`${b.billNumber}.pdf`);
  toast('PDF downloaded','ok');
}

    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'Summary');

    // Sheet 2 — Customer Summary
    const s2 = [['Customer','Mobile','Total']];
    b.rows.forEach(r => s2.push([r.customerName, r.mobile||'', num(r.total)]));
    s2.push(['GRAND TOTAL','', num(b.subtotal)]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'Customer Summary');

    // Sheet 3 — Day-wise
    const header = ['Customer', ...Array.from({length:b.days},(_,i)=>pad(i+1,2)), 'Subtotal'];
    const s3 = [header];
    b.rows.forEach(r => s3.push([r.customerName, ...r.dayTotals.map(v=>num(v)), num(r.total)]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s3), 'Day-wise');

    // Sheet 4 — Payments
    const ps = await dbByIndex('bill_payments','billId',b.id);
    const s4 = [['Date','Reference','Mode','Amount']];
    ps.forEach(p=>s4.push([p.paymentDate, p.reference||'', p.paymentMode||'', num(p.amount)]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s4), 'Payments');

    const name = `${b.snapshot.companyName.replace(/[^\w]+/g,'-')}-${(b.billingMonth||'').replace(/\s+/g,'-')}.xlsx`;
    XLSX.writeFile(wb, name);
  } else {
    const sheet = [['Bill', b.billNumber],['Type', b.billType],['Customer', b.snapshot.customerName],[]];
    sheet.push(['Date','Description','Amount']);
    b.items.forEach(i => sheet.push([i.date || b.billingPeriodStart, i.description || i.name, num(i.amount)]));
    sheet.push(['','Total', num(b.subtotal)]);
    sheet.push(['','Paid', num(b.paidAmount)]);
    sheet.push(['','Outstanding', num(b.outstanding)]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet), 'Bill');
    XLSX.writeFile(wb, `${b.billNumber}.xlsx`);
  }
  toast('Excel downloaded','ok');
}

async function shareBill(id){
  const b = await dbGet('bills', id);
  if (!b) return;
  const bus = b.snapshot.business || {};
  const lines = [];
  lines.push(bus.name || 'Barkat Tiffin Service');
  lines.push('');
  if (b.billType === 'COMPANY_MONTHLY'){
    lines.push('Monthly Company Invoice');
    lines.push(`Company: ${b.snapshot.companyName}`);
    lines.push(`Billing Period: ${b.billingMonth}`);
    lines.push('');
    lines.push(`Total Bill: ${money(b.subtotal)}`);
    lines.push(`Paid: ${money(b.paidAmount)}`);
    lines.push(`Outstanding: ${money(b.outstanding + b.previousBalance)}`);
  } else if (b.billType === 'CUSTOMER_MONTHLY'){
    lines.push('Monthly Bill');
    lines.push(`Customer: ${b.snapshot.customerName}`);
    lines.push(`Period: ${b.billingMonth}`);
    lines.push('');
    lines.push(`Total: ${money(b.subtotal)}`);
    lines.push(`Paid: ${money(b.paidAmount)}`);
    lines.push(`Outstanding: ${money(b.outstanding)}`);
  } else {
    lines.push('Daily Bill');
    lines.push(`Customer: ${b.snapshot.customerName}`);
    lines.push(`Date: ${isoDisplay(b.billingPeriodStart)}`);
    lines.push('');
    b.items.forEach(i => lines.push(`${i.name} x${i.qty} — ${money(i.amount)}`));
    lines.push('');
    lines.push(`Total: ${money(b.subtotal)}`);
  }
  lines.push('');
  lines.push(`Bill No: ${b.billNumber}`);
  lines.push('');
  lines.push('Thank you.');
  const text = lines.join('\n');

  if (navigator.share){
    try { await navigator.share({title:b.billNumber, text}); toast('Shared','ok'); }
    catch(e){ /* user cancelled */ }
  } else {
    await navigator.clipboard.writeText(text);
    toast('Bill text copied to clipboard','ok');
  }
}

/* =========================================================
   MODAL helpers
   ========================================================= */
function modal({title, body, wide, save, footHtml}){
  const html = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal ${wide?'wide':''}">
        <div class="modal-head"><h3>${esc(title)}</h3><button class="ghost sm" onclick="closeModal()">✕</button></div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          ${footHtml || `
            <button onclick="closeModal()">Cancel</button>
            <button class="primary" id="modalSaveBtn">Save</button>
          `}
        </div>
      </div>
    </div>
  `;
  $('#modalRoot').innerHTML = html;
  if (save) $('#modalSaveBtn').onclick = save;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
