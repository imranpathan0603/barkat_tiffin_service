<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Barkat Tiffin Service — offline tiffin register, daily entry and monthly register">
<title>Barkat Tiffin Service</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="appbar">
  <button class="icon-btn" data-action="toggle-drawer" aria-label="Open menu">☰</button>
  <div class="appbar-title">
    <strong id="brandName">Barkat Tiffin Service</strong>
    <span id="viewTitle">Dashboard</span>
  </div>
  <button class="icon-btn" id="backupBtn" data-action="nav" data-view="backup" aria-label="Backup">⛁</button>
</header>

<main id="view" class="view">
  <div class="empty"><div class="spinner"></div><p>Loading…</p></div>
</main>

<nav class="bottomnav">
  <button data-action="nav" data-view="dashboard"><span>▦</span>Home</button>
  <button data-action="nav" data-view="dailyEntry"><span>✎</span>Entry</button>
  <button data-action="nav" data-view="register"><span>▤</span>Register</button>
  <button data-action="nav" data-view="customers"><span>☺</span>Customers</button>
  <button data-action="toggle-drawer"><span>☰</span>More</button>
</nav>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <strong>Barkat Tiffin Service</strong>
    <span>Management Console</span>
  </div>
  <nav class="drawer-nav">
    <button data-action="nav" data-view="dashboard">▦ Dashboard</button>
    <button data-action="nav" data-view="customers">☺ Customers</button>
    <button data-action="nav" data-view="companies">🏢 Companies</button>
    <button data-action="nav" data-view="foodItems">🍱 Food Items</button>
    <button data-action="nav" data-view="dailyEntry">✎ Daily Entry</button>
    <button data-action="nav" data-view="register">▤ Monthly Register</button>
    <button data-action="nav" data-view="payments">₹ Payments</button>
    <button data-action="nav" data-view="bills">🧾 Bills</button>
    <button data-action="nav" data-view="reports">📊 Reports</button>
    <button data-action="nav" data-view="backup">⛁ Backup &amp; Restore</button>
    <button data-action="nav" data-view="settings">⚙ Settings</button>
  </nav>
</aside>
<div id="scrim" class="scrim" data-action="close-drawer"></div>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="modalTitle">Title</h3>
      <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
    </div>
    <div id="modalBody" class="sheet-body"></div>
    <div id="modalFooter" class="sheet-foot"></div>
  </div>
</div>

<div id="confirm" class="modal">
  <div class="sheet small">
    <div class="sheet-body"><p id="confirmMsg"></p></div>
    <div class="sheet-foot">
      <button class="btn ghost" data-action="confirm-no">Cancel</button>
      <button class="btn danger" id="confirmOk" data-action="confirm-yes">Confirm</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="script.js"></script>

</body>
</html>
